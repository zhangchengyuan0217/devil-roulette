<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恶魔转盘</title>
  <link rel="stylesheet" href="./css/style.css">
  <script src="./lib/Photon-Javascript_SDK.js"></script>
  <script src="./js/cards.js"></script>
  <script src="./js/game.js"></script>
</head>

<body>
  <header class="topbar">
    <div>
      <div class="brand">DEVIL ROULETTE</div>
      <div class="meta" id="status">正在连接服务器...</div>
    </div>
    <div class="topbar-controls">
      <details class="log-popover" id="logDrawer">
        <summary>对局日志</summary>
        <div class="log-popover-panel">
          <div id="log"></div>
        </div>
      </details>
      <label class="meta">房间 <input id="roomName" value="DevilRoom_101" style="width:120px"></label>
      <button id="reconnectBtn" type="button">重连</button>
      <span class="meta" id="roomInfo"></span>
    </div>
  </header>

  <section class="lobby-shell" id="lobbyPanel">
    <h2>等待开局</h2>
    <p class="meta">四人组队：上下为队友、左右为对手（红蓝分队）。也可先点「模拟对局」单人预览。</p>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <select id="modeSelect">
        <option value="team" selected>组队 2v2（上下队友 · 红蓝）</option>
        <option value="ffa">混战</option>
      </select>
      <select id="simCountSelect" title="模拟人数">
        <option value="2">模拟 2 人</option>
        <option value="3">模拟 3 人</option>
        <option value="4" selected>模拟 4 人</option>
      </select>
      <button id="startBtn" class="primary" type="button" disabled>开始游戏</button>
      <button id="simBtn" class="primary" type="button">模拟对局</button>
      <button id="exitSimBtn" type="button" style="display:none">退出模拟</button>
    </div>
  </section>

  <section class="table-wrap" id="gamePanel">
    <div class="round-banner" id="roundInfo"></div>

    <div class="board-arena" id="boardArena">
      <div class="seat-slot seat-top" id="seatTop"></div>
      <div class="seat-slot seat-left" id="seatLeft"></div>
      <div class="felt">
        <div class="loadout-row" id="loadoutRow"></div>
        <div class="cylinder" id="cylinder"></div>
        <div class="felt-status" id="feltStatus">弹药区</div>
        <div class="effect-pills" id="effectPills"></div>
      </div>
      <div class="seat-slot seat-right" id="seatRight"></div>
      <div class="seat-slot seat-bottom" id="seatBottom"></div>
    </div>

    <!-- 非四人布局时，对手仍可显示在上方条 -->
    <div class="opponents" id="opponents"></div>

    <div class="me-zone">
      <div class="me-seat-col" id="mySeat"></div>
      <div class="hand-block">
        <div class="hand-label">我的道具手牌（每轮开局抽 2 张，点选后可使用）</div>
        <div class="hand-fan" id="hand"></div>
        <div class="private-toast" id="privateInfo"></div>
      </div>
    </div>

    <div class="actions-dock" id="actionBar">
      <button id="useItemBtn" type="button" disabled>使用道具</button>
      <button id="ironRoseBtn" type="button" disabled style="display:none">铁玫瑰</button>
      <span id="snakeBar" style="display:none;align-items:center;gap:8px">
        <span class="meta" id="snakeHint"></span>
        <button id="snakeBtn" class="primary" type="button">复制（-1血）</button>
        <button id="snakePassBtn" type="button">放弃</button>
      </span>
      <span id="awaitBar" style="display:none;align-items:center;gap:8px">
        <span class="meta" id="awaitHint"></span>
      </span>
    </div>
  </section>

  <div class="reveal-overlay" id="revealOverlay">
    <div class="reveal-title">角色揭示</div>
    <div class="reveal-row" id="revealRow"></div>
    <button class="primary" type="button" id="revealCloseBtn">进入对局</button>
  </div>

  <div class="first-spin-overlay" id="firstSpinOverlay">
    <div class="first-spin-title">本局先手</div>
    <div class="first-spin-sub">转轮决定由谁开始本局…</div>
    <div class="first-spin-card" id="firstSpinCard">
      <div class="first-spin-name" id="firstSpinName">?</div>
      <div class="first-spin-role" id="firstSpinRole"></div>
    </div>
    <div class="first-spin-result" id="firstSpinResult"></div>
  </div>

  <div class="ammo-draw-overlay" id="ammoDrawOverlay">
    <div class="ammo-draw-title">弹药数量牌</div>
    <div class="ammo-draw-sub" id="ammoDrawSub">第 1 轮装弹…</div>
    <div class="ammo-draw-row">
      <div class="ammo-draw-tile live" id="ammoLiveTile">
        <div class="ammo-draw-label">实弹</div>
        <div class="ammo-draw-num" id="ammoLiveNum">?</div>
      </div>
      <div class="ammo-draw-plus">+</div>
      <div class="ammo-draw-tile blank" id="ammoBlankTile">
        <div class="ammo-draw-label">空弹</div>
        <div class="ammo-draw-num" id="ammoBlankNum">?</div>
      </div>
      <div class="ammo-draw-special" id="ammoSpecialTile" hidden>
        <div class="ammo-draw-plus">+</div>
        <div class="ammo-draw-tile special">
          <div class="ammo-draw-label">特殊</div>
          <div class="ammo-draw-num">1</div>
        </div>
      </div>
    </div>
    <div class="ammo-draw-result" id="ammoDrawResult"></div>
  </div>

  <div class="dice-overlay" id="diceOverlay">
    <div class="dice-title">止痛药</div>
    <div class="dice-sub" id="diceSub">投掷六面骰…</div>
    <div class="dice-cast" id="diceCast"></div>
    <div class="dice-cube" id="diceCube">
      <span class="dice-face" id="diceFace">?</span>
    </div>
    <div class="dice-result" id="diceResult"></div>
  </div>

  <div class="eject-overlay" id="ejectOverlay">
    <div class="eject-title">退弹</div>
    <div class="eject-sub" id="ejectSub">弃置弹药堆顶…</div>
    <div class="eject-cast" id="ejectCast"></div>
    <div class="eject-shell unknown" id="ejectShell">
      <span class="eject-shell-mark" id="ejectShellMark">?</span>
      <span class="eject-shell-label" id="ejectShellLabel">未知</span>
    </div>
    <div class="eject-result" id="ejectResult"></div>
  </div>

  <div class="item-fx-overlay" id="itemFxOverlay">
    <div class="item-fx-title" id="itemFxTitle">道具效果</div>
    <div class="item-fx-sub" id="itemFxSub"></div>
    <div class="item-fx-cast" id="itemFxCast"></div>
    <div class="item-fx-stage" id="itemFxStage"></div>
    <div class="item-fx-result" id="itemFxResult"></div>
  </div>

  <div class="ammo-pick-overlay" id="swapPickOverlay">
    <div class="ammo-pick-panel">
      <div class="ammo-pick-title">换弹</div>
      <div class="ammo-pick-sub" id="swapPickSub">点选两发弹药进行交换（第 1 发为下一发）</div>
      <div class="ammo-pick-row" id="swapPickRow"></div>
      <div class="ammo-pick-hint" id="swapPickHint">已选 0 / 2</div>
      <div class="ammo-pick-actions">
        <button type="button" id="swapPickCancel">取消</button>
        <button type="button" class="primary" id="swapPickConfirm" disabled>交换</button>
      </div>
    </div>
  </div>

  <div class="player-pick-overlay" id="playerPickOverlay">
    <div class="player-pick-panel">
      <div class="player-pick-title" id="playerPickTitle">选择目标</div>
      <div class="player-pick-sub" id="playerPickSub">点选一名玩家</div>
      <div class="player-pick-grid" id="playerPickGrid"></div>
      <div class="player-pick-hint" id="playerPickHint">已选 0</div>
      <div class="player-pick-actions" id="playerPickActions">
        <button type="button" id="playerPickCancel">取消</button>
        <button type="button" id="playerPickExtra" style="display:none"></button>
        <button type="button" class="primary" id="playerPickConfirm" disabled>确认</button>
      </div>
    </div>
  </div>

  <div class="db-overlay" id="dbDeclareOverlay">
    <div class="db-panel">
      <div class="db-title">双管 · 声明</div>
      <div class="db-sub" id="dbDeclareSub">选择第几发，并声明为实弹或空弹</div>
      <div class="ammo-pick-row" id="dbDeclareRow"></div>
      <div class="db-kind-row" id="dbKindRow">
        <button type="button" class="db-kind-btn" data-kind="live">实弹</button>
        <button type="button" class="db-kind-btn" data-kind="blank">空弹</button>
      </div>
      <div class="ammo-pick-hint" id="dbDeclareHint">请选择发数与类型</div>
      <div class="ammo-pick-actions" id="dbDeclareActions">
        <button type="button" class="primary" id="dbDeclareConfirm" disabled>确认声明</button>
      </div>
    </div>
  </div>

  <div class="db-overlay" id="dbRevealOverlay">
    <div class="db-panel">
      <div class="db-title" id="dbRevealTitle">双管声明</div>
      <div class="db-sub" id="dbRevealSub"></div>
      <div class="db-reveal-stage" id="dbRevealStage"></div>
      <div class="db-reveal-result" id="dbRevealResult"></div>
    </div>
  </div>

  <!-- 固定层提示：不占文档流，避免悬停重排 -->
  <div class="skill-tip" id="skillTip" aria-live="polite"></div>

  <script>
    const APP_ID = '92735fab-ee4f-41f5-8af0-303522dfc972';
    const APP_VERSION = '1.0';
    const EVT_ACTION = 30;
    const EVT_STATE = 31;
    const EVT_FULL = 33;   // 完整权威状态备份（房主迁移用）
    const EVT_HELLO = 34;  // 新人进房请求同步

    const ROOM_OPTS = {
      maxPlayers: 4,
      // 空房保留 5 分钟，避免房主刷新瞬间房间被拆
      emptyRoomLiveTime: 300000,
      // 断线玩家保留 3 分钟，便于同 UserId 重连回原座位
      playerTTL: 180000
    };

    const statusDiv = document.getElementById('status');
    const logBox = document.getElementById('log');
    const LBC = Photon.LoadBalancing.LoadBalancingClient;

    let client = null;
    let gameState = null;
    let fullStateBackup = null;
    let view = null;
    let selectedHand = [];
    let selectedTarget = null;
    let myActorNr = 0;
    let lastRevealKey = '';
    let revealedOnce = false;
    let preferredRoom = 'DevilRoom_101';
    let offlineSim = false;
    let botTimer = null;
    let lastSpinToken = '';
    let spinAnimTimer = null;
    let lastAmmoToken = '';
    let ammoAnimTimer = null;
    let lastDiceToken = '';
    let diceAnimTimer = null;
    let lastEjectToken = '';
    let ejectAnimTimer = null;
    let lastItemFxToken = '';
    let itemFxTimer = null;
    let snakeTimer = null;
    let snakeTimerToken = '';
    let snakeCountdownTimer = null;
    let swapPickPending = null; // { itemIndex }
    let swapPickSelected = [];
    let playerPickState = null; // { min, max, selected, onConfirm, onExtra, ... }
    let dbDeclareIndex = null;
    let dbDeclareKind = null;
    let lastDbDeclareToken = '';
    let lastDbRevealToken = '';
    let dbRevealTimer = null;

    function getStableUserId() {
      const key = 'devil_roulette_uid';
      let id = localStorage.getItem(key);
      if (!id) {
        id = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem(key, id);
      }
      return id;
    }

    function gameLog(msg) {
      logBox.innerHTML += `<div>${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function syncLogFromView() {
      if (!view || !view.publicLog) return;
      logBox.innerHTML = view.publicLog.map((m) => `<div>${m}</div>`).join('');
      logBox.scrollTop = logBox.scrollHeight;
    }

    function roomActors() {
      const map = client.myRoomActors() || {};
      return Object.keys(map).map((k) => map[k]);
    }

    /** 以 Photon MasterClient 为准；模拟模式始终本地权威 */
    function isHost() {
      if (offlineSim) return true;
      if (!client || !client.isJoinedToRoom()) return false;
      return client.myActor().actorNr === client.myRoomMasterActorNr();
    }

    function clearBotTimer() {
      if (botTimer) {
        clearTimeout(botTimer);
        botTimer = null;
      }
    }

    function refreshLocalView() {
      if (!gameState) return;
      applyView(publicView(gameState, myActorNr));
      scheduleBotIfNeeded();
    }

    function clearSnakeTimers() {
      if (snakeTimer) {
        clearTimeout(snakeTimer);
        snakeTimer = null;
      }
      if (snakeCountdownTimer) {
        clearInterval(snakeCountdownTimer);
        snakeCountdownTimer = null;
      }
      snakeTimerToken = '';
    }

    function armRattlesnakeWindow(awaiting) {
      if (!awaiting || awaiting.type !== 'rattlesnake') {
        clearSnakeTimers();
        return;
      }
      if (snakeTimerToken === awaiting.token) return;
      clearSnakeTimers();
      snakeTimerToken = awaiting.token;

      const updateHint = () => {
        const hint = document.getElementById('snakeHint');
        if (!hint || !view || !view.awaiting || view.awaiting.token !== awaiting.token) return;
        const leftMs = Math.max(0, (view.awaiting.expiresAt || 0) - Date.now());
        const sec = Math.ceil(leftMs / 1000);
        const name = view.awaiting.itemName || '道具';
        const mine = view.awaiting.actorNr === myActorNr;
        hint.textContent = mine
          ? `响尾蛇：复制【${name}】？ 剩余 ${sec}s`
          : `响尾蛇 #${view.awaiting.actorNr} 抉择中：【${name}】 ${sec}s`;
      };
      updateHint();
      snakeCountdownTimer = setInterval(updateHint, 200);

      // 房主或本人负责超时结算，避免卡住
      if (isHost() || awaiting.actorNr === myActorNr) {
        const ms = Math.max(200, (awaiting.expiresAt || Date.now() + 5000) - Date.now());
        snakeTimer = setTimeout(() => {
          snakeTimer = null;
          if (!view || !view.awaiting || view.awaiting.token !== awaiting.token) return;
          sendAction({ type: 'rattlesnake_timeout', token: awaiting.token });
        }, ms);
      }
    }

    function scheduleBotIfNeeded() {
      clearBotTimer();
      if (!offlineSim || !gameState || gameState.phase !== 'playing') return;
      if (gameState.awaiting && gameState.awaiting.type === 'first_player_spin') return;
      if (gameState.awaiting && gameState.awaiting.type === 'ammo_draw') return;
      if (gameState.awaiting && gameState.awaiting.type === 'painkiller_dice') return;
      if (gameState.awaiting && gameState.awaiting.type === 'eject_anim') return;
      if (gameState.awaiting && gameState.awaiting.type === 'item_fx') return;
      if (gameState.awaiting && gameState.awaiting.type === 'double_barrel_reveal') return;
      if (gameState.awaiting && gameState.awaiting.type === 'rattlesnake') {
        if (gameState.awaiting.actorNr === myActorNr) return; // 本人手动抉择
        botTimer = setTimeout(() => {
          botTimer = null;
          runBotTurn();
        }, 700);
        return;
      }
      // 双管声明：机器人自动选
      if (gameState.awaiting && gameState.awaiting.type === 'double_barrel') {
        if (gameState.awaiting.actorNr === myActorNr) return;
        botTimer = setTimeout(() => {
          botTimer = null;
          runBotTurn();
        }, 800);
        return;
      }
      const cur = gameState.turnOrder[gameState.currentTurn];
      if (cur === myActorNr) return;
      if (gameState.awaiting && gameState.awaiting.actorNr === myActorNr) return;

      botTimer = setTimeout(() => {
        botTimer = null;
        runBotTurn();
      }, 900);
    }

    function runBotTurn() {
      if (!offlineSim || !gameState || gameState.phase !== 'playing') return;
      if (gameState.awaiting && gameState.awaiting.type === 'first_player_spin') return;
      if (gameState.awaiting && gameState.awaiting.type === 'ammo_draw') return;
      if (gameState.awaiting && gameState.awaiting.type === 'painkiller_dice') return;
      if (gameState.awaiting && gameState.awaiting.type === 'eject_anim') return;
      if (gameState.awaiting && gameState.awaiting.type === 'item_fx') return;
      if (gameState.awaiting && gameState.awaiting.type === 'double_barrel_reveal') return;

      // 响尾蛇窗口（机器人）
      if (gameState.awaiting && gameState.awaiting.type === 'rattlesnake') {
        const a = gameState.awaiting;
        if (a.actorNr === myActorNr) return;
        const bot = gameState.players.find((p) => p.actorNr === a.actorNr);
        const willCopy = bot && bot.hp > 1 && Math.random() < 0.45;
        handleAction(gameState, a.actorNr, {
          type: willCopy ? 'rattlesnake_copy' : 'rattlesnake_pass'
        });
        refreshLocalView();
        return;
      }

      // 双管声明（机器人）
      if (gameState.awaiting && gameState.awaiting.type === 'double_barrel') {
        const a = gameState.awaiting;
        if (a.actorNr === myActorNr) return;
        handleAction(gameState, a.actorNr, {
          type: 'double_barrel',
          index: 1 + Math.floor(Math.random() * a.magSize),
          kind: Math.random() < 0.5 ? 'live' : 'blank'
        });
        refreshLocalView();
        return;
      }

      const curNr = gameState.turnOrder[gameState.currentTurn];
      if (curNr === myActorNr) return;
      const bot = gameState.players.find((p) => p.actorNr === curNr);
      if (!bot || !bot.alive) {
        refreshLocalView();
        return;
      }

      // 偶尔用一张简单道具
      if (bot.hand.length && Math.random() < 0.35) {
        const idx = Math.floor(Math.random() * bot.hand.length);
        const id = bot.hand[idx];
        const payload = {};
        if (id === 'bind') {
          const foes = gameState.players.filter((p) => p.alive && p.actorNr !== bot.actorNr);
          if (foes.length) payload.targetActorNr = foes[Math.floor(Math.random() * foes.length)].actorNr;
        } else if (id === 'inspect' || id === 'peek_top') {
          payload.index = 0;
        } else if (id === 'swap' && gameState.magazine.length >= 2) {
          payload.i = 0;
          payload.j = 1;
        } else if (id === 'double_arrow') {
          const foes = gameState.players.filter((p) => p.alive && p.actorNr !== bot.actorNr);
          payload.targets = foes.slice(0, 1).map((p) => p.actorNr);
        }
        // 跳过需要复杂选择且可能无效的牌，直接开枪更稳
        if (['bind', 'bandage', 'lucky_coin', 'painkiller', 'eject', 'shotgun', 'reverse', 'peek_top'].includes(id)) {
          handleAction(gameState, curNr, { type: 'use_item', itemIndex: idx, payload });
          refreshLocalView();
          return;
        }
      }

      const foes = gameState.players.filter((p) => p.alive && p.actorNr !== bot.actorNr);
      const shootSelf = Math.random() < 0.45 || !foes.length;
      const target = shootSelf ? bot.actorNr : foes[Math.floor(Math.random() * foes.length)].actorNr;
      let nightOwlTargetNr;
      if (shootSelf && bot.role === 'night_owl' && bot.hp <= 4 && foes.length) {
        nightOwlTargetNr = foes[0].actorNr;
      }
      handleAction(gameState, curNr, {
        type: 'shoot',
        targetActorNr: target,
        nightOwlTargetNr
      });
      refreshLocalView();
    }

    function startOfflineSim() {
      clearBotTimer();
      offlineSim = true;
      let n = Number(document.getElementById('simCountSelect').value) || 4;
      n = Math.max(2, Math.min(4, n));
      let mode = document.getElementById('modeSelect').value;
      if (mode === 'team' && n !== 4) {
        mode = 'ffa';
        gameLog('模拟人数不是 4，已用混战模式');
      }

      myActorNr = 1;
      const actors = [];
      for (let i = 1; i <= n; i++) {
        actors.push({ actorNr: i, name: i === 1 ? '我（模拟）' : `电脑${i}` });
      }

      gameState = createEmptyState();
      revealedOnce = false;
      lastRevealKey = '';
      lastSpinToken = '';
      lastAmmoToken = '';
      lastDiceToken = '';
      lastEjectToken = '';
      lastItemFxToken = '';
      selectedHand = [];
      selectedTarget = null;
      initPlayers(gameState, actors, mode);
      if (mode === 'team') {
        gameState.players.forEach((p, i) => { p.team = i % 2; });
        gameState.turnOrder = actors.map((a) => a.actorNr);
        const fp = gameState.awaiting && (
          gameState.awaiting.type === 'first_player_spin'
            ? gameState.awaiting.actorNr
            : (gameState.awaiting.type === 'ammo_draw' && gameState.awaiting.firstPlayer
              ? gameState.awaiting.firstPlayer.actorNr
              : null)
        );
        if (fp) {
          const i = gameState.turnOrder.indexOf(fp);
          if (i > 0) {
            gameState.turnOrder = gameState.turnOrder.slice(i).concat(gameState.turnOrder.slice(0, i));
          }
          gameState.currentTurn = 0;
        }
      }

      statusDiv.textContent = `模拟对局中（${n}人 · ${mode === 'team' ? '组队' : '混战'}）`;
      document.getElementById('exitSimBtn').style.display = '';
      document.getElementById('roomInfo').textContent = '本地模拟 · 无需联机';
      gameLog('—— 进入模拟对局：你是玩家#1，其余由电脑行动 ——');
      refreshLocalView();
    }

    function exitOfflineSim() {
      clearBotTimer();
      if (spinAnimTimer) {
        clearInterval(spinAnimTimer);
        spinAnimTimer = null;
      }
      if (ammoAnimTimer) {
        clearInterval(ammoAnimTimer);
        ammoAnimTimer = null;
      }
      if (diceAnimTimer) {
        clearInterval(diceAnimTimer);
        diceAnimTimer = null;
      }
      if (ejectAnimTimer) {
        clearTimeout(ejectAnimTimer);
        ejectAnimTimer = null;
      }
      if (itemFxTimer) {
        clearTimeout(itemFxTimer);
        itemFxTimer = null;
      }
      lastSpinToken = '';
      lastAmmoToken = '';
      lastDiceToken = '';
      lastEjectToken = '';
      lastItemFxToken = '';
      offlineSim = false;
      gameState = null;
      fullStateBackup = null;
      view = { phase: 'lobby', players: [], turnOrder: [], currentTurn: 0, publicLog: [] };
      revealedOnce = false;

    function slimStateForPersist(state) {
      if (!state) return null;
      const copy = JSON.parse(JSON.stringify(state));
      if (copy.publicLog && copy.publicLog.length > 25) {
        copy.publicLog = copy.publicLog.slice(-25);
      }
      return copy;
    }

    function persistAndBroadcast() {
      if (!gameState || !isHost()) return;

      if (offlineSim) {
        refreshLocalView();
        return;
      }

      fullStateBackup = slimStateForPersist(gameState);

      // 房间属性备份：房主刷新后空房仍在时，可从属性恢复
      try {
        const payload = JSON.stringify(fullStateBackup);
        if (payload.length < 12000) {
          client.myRoom().setCustomProperties({ gs: payload });
        }
      } catch (e) {
        console.warn('persist room props failed', e);
      }

      // 发给所有人做内存备份，便于 Master 迁移
      client.raiseEvent(EVT_FULL, fullStateBackup, {
        receivers: Photon.LoadBalancing.Constants.ReceiverGroup.All
      });

      roomActors().forEach((actor) => {
        client.raiseEvent(EVT_STATE, publicView(gameState, actor.actorNr), {
          targetActors: [actor.actorNr]
        });
      });
      applyView(publicView(gameState, myActorNr));
    }

    function broadcastState() {
      persistAndBroadcast();
    }

    function tryBecomeHostWithBackup(reason) {
      if (!isHost()) return false;
      if (gameState) return true;
      if (fullStateBackup) {
        gameState = JSON.parse(JSON.stringify(fullStateBackup));
        gameLog(`已成为房主，已从备份恢复对局（${reason}）`);
        persistAndBroadcast();
        return true;
      }
      // 尝试房间属性
      try {
        const props = client.myRoom().getCustomProperties() || {};
        if (props.gs) {
          gameState = JSON.parse(props.gs);
          fullStateBackup = slimStateForPersist(gameState);
          gameLog(`已成为房主，已从房间存档恢复对局（${reason}）`);
          persistAndBroadcast();
          return true;
        }
      } catch (e) {
        console.warn(e);
      }
      return false;
    }

    function showSkillTip(roleId, playerName, anchorEl) {
      const tip = document.getElementById('skillTip');
      if (!tip) return;
      if (!roleId) {
        tip.classList.remove('show');
        return;
      }
      const role = roleMeta(roleId);
      tip.innerHTML = `<strong>${playerName || ''} · ${role.name}</strong><span>${role.desc}</span>`;
      tip.classList.add('show');

      // 先显示再量尺寸，贴在卡牌旁，不挤占布局
      const pad = 12;
      const rect = (anchorEl && anchorEl.getBoundingClientRect)
        ? anchorEl.getBoundingClientRect()
        : { left: pad, right: pad + 120, top: pad, bottom: pad + 80, width: 120, height: 80 };
      const tw = tip.offsetWidth || 280;
      const th = tip.offsetHeight || 80;

      let left = rect.left + rect.width / 2 - tw / 2;
      let top = rect.bottom + 8;
      if (top + th > window.innerHeight - pad) {
        top = rect.top - th - 8;
      }
      left = Math.max(pad, Math.min(left, window.innerWidth - tw - pad));
      top = Math.max(pad, top);

      tip.style.transform = `translate3d(${Math.round(left)}px, ${Math.round(top)}px, 0)`;
    }

    function playAmmoDraw(awaiting) {
      const overlay = document.getElementById('ammoDrawOverlay');
      const liveNum = document.getElementById('ammoLiveNum');
      const blankNum = document.getElementById('ammoBlankNum');
      const liveTile = document.getElementById('ammoLiveTile');
      const blankTile = document.getElementById('ammoBlankTile');
      const specialWrap = document.getElementById('ammoSpecialTile');
      const resultEl = document.getElementById('ammoDrawResult');
      const subEl = document.getElementById('ammoDrawSub');

      if (ammoAnimTimer) {
        clearInterval(ammoAnimTimer);
        ammoAnimTimer = null;
      }

      overlay.classList.add('show');
      overlay.classList.remove('landed', 'phase-blank', 'phase-done');
      liveTile.classList.add('spinning');
      blankTile.classList.remove('spinning', 'land');
      liveTile.classList.remove('land');
      specialWrap.hidden = true;
      specialWrap.classList.remove('pop');
      resultEl.textContent = '';
      subEl.textContent = `第 ${awaiting.round} 轮 · 抽取实弹数量…`;
      liveNum.textContent = '?';
      blankNum.textContent = '?';

      const liveTarget = awaiting.live || 1;
      const blankTarget = awaiting.blank || 1;
      let tick = 0;
      const liveTicks = 14 + Math.floor(Math.random() * 6);
      const blankTicks = 14 + Math.floor(Math.random() * 6);
      let phase = 'live'; // live | blank | done

      ammoAnimTimer = setInterval(() => {
        tick += 1;
        if (phase === 'live') {
          liveNum.textContent = 1 + Math.floor(Math.random() * 6);
          if (tick >= liveTicks) {
            liveNum.textContent = liveTarget;
            liveTile.classList.remove('spinning');
            liveTile.classList.add('land');
            phase = 'blank';
            tick = 0;
            overlay.classList.add('phase-blank');
            blankTile.classList.add('spinning');
            subEl.textContent = `第 ${awaiting.round} 轮 · 抽取空弹数量…`;
          }
        } else if (phase === 'blank') {
          blankNum.textContent = 1 + Math.floor(Math.random() * 6);
          if (tick >= blankTicks) {
            blankNum.textContent = blankTarget;
            blankTile.classList.remove('spinning');
            blankTile.classList.add('land');
            phase = 'done';
            overlay.classList.add('phase-done', 'landed');
            // 仅场上有银刺（本轮塞入特殊弹）时展示
            const special = awaiting.special || 0;
            if (special > 0) {
              specialWrap.hidden = false;
              specialWrap.classList.add('pop');
            }
            resultEl.textContent = special > 0
              ? `本轮装入 ${liveTarget} 实弹 + ${blankTarget} 空弹 + 特殊弹`
              : `本轮装入 ${liveTarget} 实弹 + ${blankTarget} 空弹`;
            subEl.textContent = `第 ${awaiting.round} 轮装弹完成`;
            clearInterval(ammoAnimTimer);
            ammoAnimTimer = null;
            setTimeout(() => {
              overlay.classList.remove('show', 'landed', 'phase-blank', 'phase-done');
              liveTile.classList.remove('land');
              blankTile.classList.remove('land');
              specialWrap.hidden = true;
              specialWrap.classList.remove('pop');
              finishAmmoDraw();
            }, 1100);
          }
        }
      }, 85);
    }

      face.textContent = '?';

      let tick = 0;
      const ticks = 16 + Math.floor(Math.random() * 8);
      diceAnimTimer = setInterval(() => {
        tick += 1;
        face.textContent = 1 + Math.floor(Math.random() * 6);
        if (tick >= ticks) {
          clearInterval(diceAnimTimer);
          diceAnimTimer = null;
          face.textContent = target;
          cube.classList.remove('rolling');
          cube.classList.add('land');
          overlay.classList.add('landed', odd ? 'odd' : 'even');
          resultEl.textContent = odd
            ? `掷出 ${target}（奇数）→ ${who} 失去 1 点血量`

          subEl.textContent = `效果发送：${who}`;
          setTimeout(() => {
            overlay.classList.remove('show', 'landed', 'odd', 'even');
            cube.classList.remove('land');
            castEl.innerHTML = '';
            finishPainkillerDice();
          }, 1200);
        }
      }, 70);
    }

    function fxPublicTargets(awaiting) {
      const list = [];
      if (!awaiting) return list;
      if (awaiting.targetActorNr != null) {
        list.push({
          actorNr: Number(awaiting.targetActorNr),
          name: awaiting.targetName || `#${awaiting.targetActorNr}`
        });
      }
      if (Array.isArray(awaiting.linkActors) && awaiting.linkActors.length) {
        awaiting.linkActors.forEach((nr, i) => {
          const name = (awaiting.linkNames && awaiting.linkNames[i]) || `#${nr}`;
          if (!list.some((t) => t.actorNr === Number(nr))) {
            list.push({ actorNr: Number(nr), name });
          }
        });
      }
      return list;
    }

      if (!awaiting) return { caster: null, targets: [] };
      const caster = awaiting.actorNr != null ? Number(awaiting.actorNr) : null;

              ? `<div class="fx-mini-card"><img src="${it.art}" alt="${it.name}"></div>`
              : `<div class="fx-mini-card fallback">${it.glyph}<span>${it.name}</span></div>`;
          }).join('');
          stageHtml = `<div class="fx-card-row">${cards || '<div class="fx-icon fx-draw">＋2</div>'}</div>`;
          resultText = `抽到 ${(awaiting.drawn || []).map((cid) => itemMeta(cid).name).join('、') || '道具'}`;
        }
      } else if (id === 'bandage') {
        stageHtml = `<div class="fx-icon fx-heal">♥</div>`;
        resultText = `${awaiting.targetName || who} 回复 1 点血量`;
      } else if (id === 'inspect' || id === 'peek_top') {
        const pos = (awaiting.peekIndex || 0) + 1;
        if (awaiting.hidden || !mine) {
          stageHtml = `<div class="fx-shell unknown"><span>?</span></div>`;
          resultText = id === 'peek_top'
            ? `${who} 查看了弹药堆顶（内容仅本人可见）`
            : `${who} 检视了第 ${pos} 发（内容仅本人可见）`;
        } else {
          const b = awaiting.bullet;
          const cls = b === 'live' ? 'live' : b === 'blank' ? 'blank' : 'special';
          const mark = b === 'live' ? '实' : b === 'blank' ? '空' : '特';
          stageHtml = `<div class="fx-shell ${cls} reveal"><span>${mark}</span><small>${bulletLabel(b)}</small></div>`;
          resultText = id === 'peek_top'
            ? `堆顶是【${bulletLabel(b)}】`
            : `第 ${pos} 发是【${bulletLabel(b)}】`;
        }
      } else if (id === 'shotgun') {
        stageHtml = `<div class="fx-icon fx-shotgun">霰</div>`;
        resultText = '下一发实弹伤害 ×2（全员可见）';
      } else if (id === 'swap') {
        stageHtml = `<div class="fx-swap"><span class="fx-shell unknown"><span>${awaiting.swapFrom || '?'}</span></span><span class="fx-swap-arrow">⇄</span><span class="fx-shell unknown"><span>${awaiting.swapTo || '?'}</span></span></div>`;
        resultText = `${who} 交换第 ${awaiting.swapFrom} 发 ↔ 第 ${awaiting.swapTo} 发`;
      } else if (id === 'reverse') {
        stageHtml = `<div class="fx-icon fx-reverse">实 ⇄ 空</div>`;
        resultText = '下一发实弹与空弹互换（全员可见）';
      } else if (id === 'bind') {
        stageHtml = `<div class="fx-icon fx-bind">捆</div>`;
        resultText = `${who} → ${awaiting.targetName || '目标'}：下一回合无法行动`;
      } else if (id === 'double_arrow') {
        if (awaiting.unlock) {
          stageHtml = `<div class="fx-icon fx-unlink">解</div>`;
          resultText = `${who} 解除了连锁`;
        } else {
          stageHtml = `<div class="fx-icon fx-link">雕</div>`;
          resultText = `${who} 连锁 → ${(awaiting.linkNames || []).join('、') || '无'}`;
        }
      } else {
        stageHtml = `<div class="fx-icon">✦</div>`;
        resultText = `${who} 使用了【${itemName}】`;
      }

      stage.innerHTML = stageHtml;
      requestAnimationFrame(() => overlay.classList.add('play'));

      itemFxTimer = setTimeout(() => {
        overlay.classList.add('landed');
        result.textContent = resultText;
        sub.textContent = targets.length
          ? `效果发送：${targets.map((t) => t.name).join('、')}`
          : '效果结算';
        itemFxTimer = setTimeout(() => {
          overlay.classList.remove('show', 'landed', 'play');
          stage.innerHTML = '';
          cast.innerHTML = '';
          itemFxTimer = null;
          finishItemFx();
        }, 1400);
      }, 1300);
    }

    function finishFirstPlayerSpin() {
      if (!isHost()) return;
      sendAction({ type: 'first_player_done' });
    }

    function maybeShowFirstSpin() {
      const overlay = document.getElementById('firstSpinOverlay');
      const awaiting = view && view.awaiting;
      if (!awaiting || awaiting.type !== 'first_player_spin') {
        overlay.classList.remove('show', 'landed');
        return;
      }
      if (document.getElementById('revealOverlay').classList.contains('show')) return;
      if (document.getElementById('ammoDrawOverlay').classList.contains('show')) return;
      if (document.getElementById('diceOverlay').classList.contains('show')) return;
      if (document.getElementById('ejectOverlay').classList.contains('show')) return;
      if (document.getElementById('itemFxOverlay').classList.contains('show')) return;
      if (awaiting.token && awaiting.token === lastSpinToken) {
        if (!overlay.classList.contains('show')) overlay.classList.add('show');
        return;
      }
      lastSpinToken = awaiting.token || `${awaiting.round}-${awaiting.actorNr}`;
      playFirstPlayerSpin(awaiting);
    }

    function playFirstPlayerSpin(awaiting) {
      const overlay = document.getElementById('firstSpinOverlay');
      const nameEl = document.getElementById('firstSpinName');
      const roleEl = document.getElementById('firstSpinRole');
      const resultEl = document.getElementById('firstSpinResult');
      const cardEl = document.getElementById('firstSpinCard');
      const candidates = awaiting.candidates || [];
      if (!candidates.length) {
        finishFirstPlayerSpin();
        return;
      }

      if (spinAnimTimer) {
        clearInterval(spinAnimTimer);
        spinAnimTimer = null;
      }

      overlay.classList.add('show');
      overlay.classList.remove('landed');
      resultEl.textContent = '';
      cardEl.classList.add('spinning');

      let i = 0;
      const winner = candidates.find((c) => c.actorNr === awaiting.actorNr) || candidates[0];
      const ticks = 18 + Math.floor(Math.random() * 8);
      let tick = 0;

      spinAnimTimer = setInterval(() => {
        const c = candidates[i % candidates.length];
        nameEl.textContent = c.name;
        roleEl.textContent = c.roleName || '';
        const meta = roleMeta(c.role);
        cardEl.style.setProperty('--hue', meta.hue || 30);
        if (meta.art) {
          cardEl.style.backgroundImage = `linear-gradient(180deg, rgba(8,6,4,0.15), rgba(8,6,4,0.72)), url('${meta.art}')`;
          cardEl.classList.add('has-art');
        } else {
          cardEl.style.backgroundImage = '';
          cardEl.classList.remove('has-art');
        }
        i += 1;
        tick += 1;

        if (tick >= ticks) {
          clearInterval(spinAnimTimer);
          spinAnimTimer = null;
          nameEl.textContent = winner.name;
          roleEl.textContent = winner.roleName || '';
          const winMeta = roleMeta(winner.role);
          cardEl.style.setProperty('--hue', winMeta.hue || 30);
          if (winMeta.art) {
            cardEl.style.backgroundImage = `linear-gradient(180deg, rgba(8,6,4,0.1), rgba(8,6,4,0.7)), url('${winMeta.art}')`;
            cardEl.classList.add('has-art');
          }
          cardEl.classList.remove('spinning');
          cardEl.classList.add('land');
          overlay.classList.add('landed');
          resultEl.textContent = `${winner.name} 先手！`;
          setTimeout(() => {
            cardEl.classList.remove('land');
            overlay.classList.remove('show', 'landed');
            finishFirstPlayerSpin();
          }, 1200);
        }
      }, 90);
    }

    function refreshDbDeclareHint() {
      const hint = document.getElementById('dbDeclareHint');
      const conf = document.getElementById('dbDeclareConfirm');
      const kindLabel = dbDeclareKind === 'live' ? '实弹' : dbDeclareKind === 'blank' ? '空弹' : null;
      if (dbDeclareIndex == null && !dbDeclareKind) {
        hint.textContent = '请选择发数，并声明实弹或空弹';
      } else if (dbDeclareIndex == null) {
        hint.textContent = `已选【${kindLabel}】· 再点一发弹药`;
      } else if (!dbDeclareKind) {
        hint.textContent = `已选第 ${dbDeclareIndex} 发 · 再选实弹或空弹`;
      } else {
        hint.textContent = `声明：第 ${dbDeclareIndex} 发是【${kindLabel}】`;
      }
      conf.disabled = !(dbDeclareIndex != null && dbDeclareKind);
      document.querySelectorAll('#dbDeclareRow .ammo-pick-shell').forEach((btn) => {
        btn.classList.toggle('picked', Number(btn.dataset.index) + 1 === dbDeclareIndex);
      });
      document.querySelectorAll('#dbKindRow .db-kind-btn').forEach((btn) => {
        btn.classList.toggle('picked', btn.dataset.kind === dbDeclareKind);
      });
    }

    function closeDbDeclare() {
      document.getElementById('dbDeclareOverlay').classList.remove('show');
      document.getElementById('dbDeclareRow').innerHTML = '';
      dbDeclareIndex = null;
      dbDeclareKind = null;
    }

    function openDbDeclare(awaiting) {
      const mine = Number(awaiting.actorNr) === Number(myActorNr);
      const overlay = document.getElementById('dbDeclareOverlay');
      const sub = document.getElementById('dbDeclareSub');
      const row = document.getElementById('dbDeclareRow');
      const actions = document.getElementById('dbDeclareActions');
      const kindRow = document.getElementById('dbKindRow');
      const count = awaiting.magSize || 0;

      if (!mine) {
        sub.textContent = `${awaiting.name || '#' + awaiting.actorNr}（双管）正在选择声明…全员等待中`;
        row.innerHTML = Array.from({ length: count }, (_, i) => `
          <div class="ammo-pick-shell" style="cursor:default">
            <span class="shell unknown"></span>
            <span class="ammo-pick-ord">第 ${i + 1} 发</span>
          </div>
        `).join('');
        kindRow.style.display = 'none';
        actions.style.display = 'none';
        document.getElementById('dbDeclareHint').textContent = '声明结果将向全员公示';
        overlay.classList.add('show');
        return;
      }

      kindRow.style.display = '';
      actions.style.display = '';
      dbDeclareIndex = null;
      dbDeclareKind = null;
      sub.textContent = `当前转轮 ${count} 发 · 点选一发并声明实弹/空弹（成功则己方下轮双倍道具）`;
      row.innerHTML = Array.from({ length: count }, (_, i) => `
        <button type="button" class="ammo-pick-shell" data-index="${i}" aria-label="第 ${i + 1} 发">
          <span class="shell unknown"></span>
          <span class="ammo-pick-ord">第 ${i + 1} 发</span>
        </button>
      `).join('');
      row.querySelectorAll('.ammo-pick-shell').forEach((btn) => {
        btn.onclick = () => {
          dbDeclareIndex = Number(btn.dataset.index) + 1;
          refreshDbDeclareHint();
        };
      });
      document.querySelectorAll('#dbKindRow .db-kind-btn').forEach((btn) => {
        btn.onclick = () => {
          dbDeclareKind = btn.dataset.kind;
          refreshDbDeclareHint();
        };
      });
      refreshDbDeclareHint();
      overlay.classList.add('show');
    }

    function maybeShowDbDeclare() {
      const overlay = document.getElementById('dbDeclareOverlay');
      const awaiting = view && view.awaiting;
      if (!awaiting || awaiting.type !== 'double_barrel') {
        closeDbDeclare();
        return;
      }
      if (document.getElementById('revealOverlay').classList.contains('show')) return;
      if (document.getElementById('ammoDrawOverlay').classList.contains('show')) return;
      if (document.getElementById('dbRevealOverlay').classList.contains('show')) return;
      const token = awaiting.token || `db-${awaiting.actorNr}-${awaiting.magSize}`;
      if (token === lastDbDeclareToken && overlay.classList.contains('show')) return;
      lastDbDeclareToken = token;
      openDbDeclare(awaiting);
    }

    function finishDbReveal() {
      if (!isHost()) return;
      sendAction({ type: 'double_barrel_done' });
    }

    function maybeShowDbReveal() {
      const overlay = document.getElementById('dbRevealOverlay');
      const awaiting = view && view.awaiting;
      if (!awaiting || awaiting.type !== 'double_barrel_reveal') {
        if (dbRevealTimer) return;
        overlay.classList.remove('show', 'landed', 'success', 'fail');
        return;
      }
      closeDbDeclare();
      if (document.getElementById('revealOverlay').classList.contains('show')) return;
      if (awaiting.token && awaiting.token === lastDbRevealToken) {
        if (!overlay.classList.contains('show')) overlay.classList.add('show');
        return;
      }
      lastDbRevealToken = awaiting.token || `dbr-${awaiting.actorNr}-${awaiting.index}`;
      playDbReveal(awaiting);
    }

    function playDbReveal(awaiting) {
      const overlay = document.getElementById('dbRevealOverlay');
      const title = document.getElementById('dbRevealTitle');
      const sub = document.getElementById('dbRevealSub');
      const stage = document.getElementById('dbRevealStage');
      const result = document.getElementById('dbRevealResult');
      if (dbRevealTimer) {
        clearTimeout(dbRevealTimer);
        dbRevealTimer = null;
      }

      const who = awaiting.name || `#${awaiting.actorNr}`;
      const declaredLabel = bulletLabel(awaiting.declared);
      const actualLabel = bulletLabel(awaiting.actual);
      const idx = awaiting.index;
      const mag = awaiting.magSize || idx;
      const actualCls = awaiting.actual === 'live' ? 'live' : awaiting.actual === 'blank' ? 'blank' : 'special';

      title.textContent = '双管 · 声明公示';
      sub.textContent = `${who} 声明第 ${idx} 发是【${declaredLabel}】`;
      result.textContent = '';
      overlay.classList.remove('landed', 'success', 'fail');
      overlay.classList.add('show');

      const shells = Array.from({ length: mag }, (_, i) => {
        const n = i + 1;
        const focus = n === idx;
        const shellCls = focus ? actualCls : 'unknown';
        const mark = focus
          ? (awaiting.actual === 'live' ? '实' : awaiting.actual === 'blank' ? '空' : '特')
          : '';
        return `<div class="db-reveal-shell${focus ? ' focus' : ''}">
          <span class="shell ${shellCls}">${mark}</span>
          <span class="ammo-pick-ord">第 ${n} 发</span>
        </div>`;
      }).join('');

      stage.innerHTML = `
        <div class="db-reveal-shells">${shells}</div>
        <div class="db-reveal-call">声明【${declaredLabel}】 → 翻开…</div>
      `;

      dbRevealTimer = setTimeout(() => {
        const gainers = (awaiting.gainers || []).map((g) => g.name || `#${g.actorNr}`).join('、') || '无人';
        const sideText = awaiting.success
          ? `声明成功！${gainers} 下轮获得双倍道具`
          : `声明失败！${gainers} 下轮获得双倍道具`;
        result.textContent = `实际为【${actualLabel}】· ${sideText}`;
        overlay.classList.add('landed', awaiting.success ? 'success' : 'fail');
        const call = stage.querySelector('.db-reveal-call');
        if (call) call.textContent = `第 ${idx} 发实际是【${actualLabel}】`;
        dbRevealTimer = setTimeout(() => {
          overlay.classList.remove('show', 'landed', 'success', 'fail');
          stage.innerHTML = '';
          dbRevealTimer = null;
          finishDbReveal();
        }, 1800);
      }, 1400);
    }

    document.getElementById('dbDeclareConfirm').onclick = () => {
      if (dbDeclareIndex == null || !dbDeclareKind) return;
      sendAction({
        type: 'double_barrel',
        index: dbDeclareIndex,
        kind: dbDeclareKind
      });
      closeDbDeclare();
    };

    function render() {
      const inRoom = !offlineSim && client && client.isJoinedToRoom();
      document.getElementById('roomInfo').textContent = offlineSim
        ? '本地模拟 · 无需联机'
        : inRoom
          ? `房间 ${client.myRoom().name} · ${client.myRoom().playerCount}人 · #${myActorNr}${isHost() ? ' 房主' : ''}`
          : '';

      document.getElementById('startBtn').disabled = offlineSim || !(isHost() && (!view || view.phase === 'lobby' || view.phase === 'ended'));
      document.getElementById('simBtn').disabled = false;
      document.getElementById('exitSimBtn').style.display = offlineSim ? '' : 'none';

      if (!view || view.phase === 'lobby') {
        document.getElementById('lobbyPanel').style.display = '';
        document.getElementById('gamePanel').classList.remove('active');
        if (!offlineSim) {
          revealedOnce = false;
          lastRevealKey = '';
        }
        return;
      }

      document.getElementById('lobbyPanel').style.display = view.phase === 'ended' ? '' : 'none';
      document.getElementById('gamePanel').classList.add('active');

      const curNr = Number(view.turnOrder[view.currentTurn]);
      const fourPlayer = view.players.length === 4;
      const panel = document.getElementById('gamePanel');
      panel.classList.toggle('layout-cross', fourPlayer);
      panel.classList.toggle('layout-classic', !fourPlayer);

      document.getElementById('roundInfo').innerHTML =
        `<strong>第 ${view.round} 轮</strong> · 弹药剩余 ${view.magazineCount}` +
        (fourPlayer
          ? (view.mode === 'team'
            ? ' · 上下队友 · <span style="color:#ff8f88">红队</span> vs <span style="color:#8eb6ff">蓝队</span>'
            : ' · 四人环桌')
          : '') +
        (view.phase === 'ended'
          ? (view.winner
            ? ` · <strong style="color:#6fbf8a">玩家#${view.winner} 获胜</strong>`
            : view.winnerTeam != null
              ? ` · <strong style="color:#6fbf8a">${view.winnerTeam === 0 ? '红队' : '蓝队'} 获胜</strong>`
              : ' · 结束')
          : ` · 当前行动 <strong>#${curNr}</strong>`);

      // 中央弹药信息：已射出 / 本轮装弹
      const loadout = view.loadout || { live: 0, blank: 0, special: 0 };
      const fired = view.fired || { live: 0, blank: 0, special: 0 };
      const showSpecial = view.players.some((p) => p.alive && p.role === 'silver_spike');
      document.getElementById('loadoutRow').innerHTML = `
        <span class="ammo-legend">子弹数</span>
        <span class="ammo-chip live"><i></i>实弹 ${fired.live}/${loadout.live}</span>
        <span class="ammo-chip blank"><i></i>空弹 ${fired.blank}/${loadout.blank}</span>
        ${showSpecial ? `<span class="ammo-chip special"><i></i>特殊 ${fired.special}/${loadout.special}</span>` : ''}
      `;

      const cyl = document.getElementById('cylinder');
      cyl.innerHTML = Array.from({ length: view.magazineCount }, () =>
        '<div class="shell unknown"></div>'
      ).join('');
      document.getElementById('feltStatus').textContent =
        view.awaiting && view.awaiting.type === 'rattlesnake'
          ? `响尾蛇抉择中：是否复制【${view.awaiting.itemName || '道具'}】…`
          : view.magazineCount
            ? `转轮剩余 ${view.magazineCount} 发（背面朝上）`
            : '本轮弹药已打空';

      const pills = [];
      if (view.effects.reverseNext) pills.push('<span class="pill">反转挂起</span>');
      if (view.effects.shotgunNext) pills.push('<span class="pill">霰弹挂起</span>');
      if (view.effects.linked.length) pills.push(`<span class="pill">连锁 ${view.effects.linked.join(',')}</span>`);
      document.getElementById('effectPills').innerHTML = pills.join('');

      const me = view.players.find((p) => p.actorNr === myActorNr);
      const myTurn = view.phase === 'playing' && !view.awaiting && curNr === Number(myActorNr);
      const fxActors = awaitingFxActors(view.awaiting);

      function seatHtml(p, shotSide) {
        const isMe = Number(p.actorNr) === Number(myActorNr);
        const ally = me && !isMe && view.mode === 'team' && p.team === me.team;
        const isCaster = fxActors.caster != null && Number(p.actorNr) === fxActors.caster;
        const isFxTarget = fxActors.targets.some((nr) => Number(nr) === Number(p.actorNr));
        const cls = [
          'hero-seat',
          isMe ? 'me' : '',
          ally ? 'ally' : '',
          p.actorNr === curNr ? 'turn' : '',
          !p.alive ? 'dead' : '',
          !isMe && selectedTarget === p.actorNr ? 'selected' : '',
          isCaster ? 'fx-caster' : '',
          isFxTarget ? 'fx-hit' : ''
        ].join(' ');
        const name = isMe ? `你 · #${p.actorNr}` : `${p.name} #${p.actorNr}`;
        const canShoot = myTurn && p.alive;
        const shootBtn = `<button type="button" class="seat-shoot-btn" data-shoot="${p.actorNr}" ${canShoot ? '' : 'disabled'}>开枪</button>`;
        const card = `<div class="${cls}" data-actor="${p.actorNr}" data-role="${p.role}" data-name="${p.name}">
          <div class="seat-name">${name}</div>
          ${roleCardHtml(p)}
        </div>`;
        const side = shotSide || 'right';
        if (side === 'left') {
          return `<div class="seat-shot-wrap side-left">${shootBtn}${card}</div>`;
        }
        return `<div class="seat-shot-wrap side-right">${card}${shootBtn}</div>`;
      }

      function bindSeats(root) {
        if (!root) return;
        root.querySelectorAll('.hero-seat').forEach((el) => {
          const nr = Number(el.dataset.actor);
          el.onmouseenter = () => showSkillTip(el.dataset.role, el.dataset.name, el);
          el.onmouseleave = () => showSkillTip(null);
          if (nr === myActorNr) return;
          el.onclick = () => {
            selectedTarget = selectedTarget === nr ? null : nr;
            render();
          };
        });
        root.querySelectorAll('.seat-shoot-btn').forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            tryShootAt(Number(btn.dataset.shoot));
          };
        });
      }

      function paintSlot(el, player, teamClass, tag, shotSide) {
        el.classList.remove('team-red', 'team-blue');
        if (teamClass) el.classList.add(teamClass);
        el.dataset.tag = tag || '';
        if (!player) {
          el.innerHTML = '';
          return;
        }
        el.innerHTML = seatHtml(player, shotSide);
        bindSeats(el);
      }

      if (fourPlayer && me) {
        const sorted = view.players.slice().sort((a, b) => a.actorNr - b.actorNr);
        let topP;
        let leftP;
        let rightP;
        let myTeamClass = 'team-red';
        let foeTeamClass = 'team-blue';

        if (view.mode === 'team') {
          myTeamClass = me.team === 0 ? 'team-red' : 'team-blue';
          foeTeamClass = me.team === 0 ? 'team-blue' : 'team-red';
          const ally = view.players.find((p) => p.team === me.team && p.actorNr !== me.actorNr);
          const foes = view.players.filter((p) => p.team !== me.team).sort((a, b) => a.actorNr - b.actorNr);
          topP = ally;
          leftP = foes[0];
          rightP = foes[1];
        } else {
          // 混战：仍十字落座，对面仅视觉相对
          const others = sorted.filter((p) => p.actorNr !== me.actorNr);
          topP = others[0];
          leftP = others[1];
          rightP = others[2];
          myTeamClass = '';
          foeTeamClass = '';
        }

        const allyTag = view.mode === 'team' ? (me.team === 0 ? '红队 · 队友' : '蓝队 · 队友') : '对面';
        const foeTagL = view.mode === 'team' ? (me.team === 0 ? '蓝队' : '红队') : '左侧';
        const foeTagR = view.mode === 'team' ? (me.team === 0 ? '蓝队' : '红队') : '右侧';

        paintSlot(document.getElementById('seatTop'), topP, view.mode === 'team' ? myTeamClass : '', allyTag, 'right');
        // 自己已在道具左侧完整展示，桌面底位不再重复
        paintSlot(document.getElementById('seatBottom'), null, '', '');
        paintSlot(document.getElementById('seatLeft'), leftP, view.mode === 'team' ? foeTeamClass : '', foeTagL, 'left');
        paintSlot(document.getElementById('seatRight'), rightP, view.mode === 'team' ? foeTeamClass : '', foeTagR, 'right');

        document.getElementById('opponents').innerHTML = '';
        document.getElementById('mySeat').innerHTML = seatHtml(me, 'left');
        bindSeats(document.getElementById('mySeat'));
      } else {
        ['seatTop', 'seatBottom', 'seatLeft', 'seatRight'].forEach((id) => {
          const el = document.getElementById(id);
          el.innerHTML = '';
          el.classList.remove('team-red', 'team-blue');
          el.dataset.tag = '';
        });
        const others = view.players.filter((p) => p.actorNr !== myActorNr);
        document.getElementById('opponents').innerHTML = others.map((p) => seatHtml(p, 'right')).join('');
        if (me) document.getElementById('mySeat').innerHTML = seatHtml(me, 'left');
        bindSeats(document.getElementById('opponents'));
        bindSeats(document.getElementById('mySeat'));
      }

      // 手牌扇形
      const myHand = (view.me && view.me.hand) || [];
      const handEl = document.getElementById('hand');
      handEl.innerHTML = myHand.map((id, i) => {
        const it = itemMeta(id);
        if (it.art) {
          return `<div class="item-card has-art ${selectedHand.includes(i) ? 'selected' : ''}" data-i="${i}" title="${it.name}">
            <img class="art-img" src="${it.art}" alt="${it.name}" draggable="false">
          </div>`;
        }
        return `<div class="item-card ${selectedHand.includes(i) ? 'selected' : ''}" data-i="${i}" style="--hue:${it.hue}" title="${it.name}">
          <span class="art-glyph">${it.glyph}</span>
          <span class="fallback-name">${it.name}</span>
        </div>`;
      }).join('') || '<span class="meta">手牌为空</span>';

      handEl.querySelectorAll('.item-card').forEach((el) => {
        el.onclick = () => {
          const i = Number(el.dataset.i);
          if (selectedHand.includes(i)) selectedHand = selectedHand.filter((x) => x !== i);
          else selectedHand.push(i);
          render();
        };
      });

      const peeks = [];
      if (view.me && view.me.lastPeek) {
        peeks.push(`检视：第 ${view.me.lastPeek.index + 1} 发 = ${bulletLabel(view.me.lastPeek.bullet)}`);
      }
      if (view.me && view.me.peekedBottom) {
        peeks.push(`火药底部：${view.me.peekedBottom.map(bulletLabel).join('、')}`);
      }
      document.getElementById('privateInfo').textContent = peeks.join(' ｜ ');

      const othersAlive = view.players.filter((p) => p.alive && p.actorNr !== myActorNr);
      if (selectedTarget && !othersAlive.some((p) => p.actorNr === selectedTarget)) {
        selectedTarget = othersAlive[0] ? othersAlive[0].actorNr : null;
      }
      if (!selectedTarget && othersAlive[0]) selectedTarget = othersAlive[0].actorNr;

      const myAwait = view.awaiting && view.awaiting.actorNr === myActorNr;
      document.getElementById('useItemBtn').disabled = !myTurn || selectedHand.length !== 1;

      // 角色专属操作：仅对应角色可见
      const ironRoseBtn = document.getElementById('ironRoseBtn');
      const isIronRose = me && me.role === 'iron_rose';
      ironRoseBtn.style.display = isIronRose ? '' : 'none';
      ironRoseBtn.disabled = !(myTurn && isIronRose && selectedHand.length === 2);

      const snakeBar = document.getElementById('snakeBar');
      const snakeAwait = view.awaiting && view.awaiting.type === 'rattlesnake';
      if (snakeAwait) {
        armRattlesnakeWindow(view.awaiting);
        const mine = view.awaiting.actorNr === myActorNr;
        snakeBar.style.display = mine ? 'inline-flex' : 'none';
        document.getElementById('snakeBtn').disabled = !mine;
        document.getElementById('snakePassBtn').disabled = !mine;
      } else {
        snakeBar.style.display = 'none';
        clearSnakeTimers();
      }

      const awaitBar = document.getElementById('awaitBar');
      if (view.awaiting && view.awaiting.type === 'double_barrel') {
        const mine = Number(view.awaiting.actorNr) === Number(myActorNr);
        awaitBar.style.display = mine ? 'none' : 'inline-flex';
        document.getElementById('awaitHint').textContent = mine
          ? ''
          : `${view.awaiting.name || '#' + view.awaiting.actorNr}（双管）正在声明…`;
      } else {
        awaitBar.style.display = 'none';
      }

      if (offlineSim) scheduleBotIfNeeded();
    }

    function sendAction(action) {
      if (offlineSim) {
        const result = handleAction(gameState, myActorNr, action);
        if (!result.ok) gameLog(`动作被拒绝：${result.reason}`);
        refreshLocalView();
        return;
      }
      client.raiseEvent(EVT_ACTION, action, {
        receivers: Photon.LoadBalancing.Constants.ReceiverGroup.All
      });
    }

    function hostProcessAction(fromActorNr, action) {
      if (!isHost() || !gameState) return;
      const result = handleAction(gameState, fromActorNr, action);
      if (!result.ok) gameLog(`动作被拒绝：${result.reason}`);
      broadcastState();
    }

    function startGameAsHost() {
      if (!isHost()) return;
      const actors = roomActors().map((a) => ({
        actorNr: a.actorNr,
        name: `玩家${a.actorNr}`
      }));
      if (actors.length < 2) {
        alert('至少需要 2 名玩家');
        return;
      }
      let mode = document.getElementById('modeSelect').value;
      if (mode === 'team' && actors.length !== 4) {
        alert('组队模式需要正好 4 人，已改为混战');
        mode = 'ffa';
      }
      gameState = createEmptyState();
      actors.sort((a, b) => a.actorNr - b.actorNr);
      revealedOnce = false;
      lastRevealKey = '';
      lastSpinToken = '';
      lastAmmoToken = '';
      lastDiceToken = '';
      lastEjectToken = '';
      lastItemFxToken = '';
      initPlayers(gameState, actors, mode);
      if (mode === 'team') {
        gameState.players.forEach((p, i) => { p.team = i % 2; });
        gameState.turnOrder = actors.map((a) => a.actorNr);
        // 保持本轮已抽出的先手
        const fp = gameState.awaiting && (
          gameState.awaiting.type === 'first_player_spin'
            ? gameState.awaiting.actorNr
            : (gameState.awaiting.type === 'ammo_draw' && gameState.awaiting.firstPlayer
              ? gameState.awaiting.firstPlayer.actorNr
              : null)
        );
        if (fp) {
          const i = gameState.turnOrder.indexOf(fp);
          if (i > 0) {
            gameState.turnOrder = gameState.turnOrder.slice(i).concat(gameState.turnOrder.slice(0, i));
          }
          gameState.currentTurn = 0;
        }
      }
      broadcastState();
    }

    function createClient(preferRejoin) {
      if (typeof Photon === 'undefined') {
        statusDiv.textContent = 'Photon SDK 加载失败';
        return;
      }
      client = new LBC(Photon.ConnectionProtocol.Wss, APP_ID, APP_VERSION);
      client.setUserId(getStableUserId());

      client.onError = function (errorCode, errorMsg) {
        statusDiv.textContent = `连接错误: ${errorCode} - ${errorMsg}`;
        gameLog(`错误: [${errorCode}] ${errorMsg}`);
      };

      client.onOperationResponse = function (errorCode, errorMsg, code) {
        if (!errorCode) return;
        gameLog(`操作失败 op=${code} code=${errorCode} msg=${errorMsg}`);
        // rejoin 失败则普通加入
        if (window.__rejoinPending && (code === 226 || code === 227)) {
          gameLog('重连原座位失败，改为普通加入同一房间名...');
          joinCreateRoom();
        }
      };

      client.onStateChange = function (state) {
        if (state === LBC.State.JoinedLobby) {
          statusDiv.textContent = '已连上大厅，正在进入房间...';
          preferredRoom = document.getElementById('roomName').value.trim() || 'DevilRoom_101';
          joinPreferredRoom(!!preferRejoin);
        } else if (state === LBC.State.Disconnected) {
          statusDiv.textContent = '已断开连接';
        }
      };

      client.onJoinRoom = function () {
        myActorNr = client.myActor().actorNr;
        window.__rejoinPending = false;
        sessionStorage.setItem('dr_room', preferredRoom);
        statusDiv.textContent = `已进入房间 · Master #${client.myRoomMasterActorNr()}`;
        gameLog(`加入成功，我是 #${myActorNr}，UserId=${client.getUserId()}，Master=#${client.myRoomMasterActorNr()}`);

        // 若房间里已有存档且我是房主，恢复
        if (isHost()) {
          tryBecomeHostWithBackup('进房');
        }

        if (!gameState) {
          // 先显示大厅，再向房主要状态
          if (!view || view.phase === 'lobby') {
            view = { phase: 'lobby', players: [], turnOrder: [], currentTurn: 0, publicLog: [] };
          }
          requestSync();
        }
        render();
      };

      client.onActorJoin = function (actor) {
        gameLog(`玩家加入 #${actor.actorNr}`);
        if (isHost() && gameState) persistAndBroadcast();
        render();
      };

      client.onActorLeave = function (actor) {
        gameLog(`玩家离开 #${actor.actorNr}`);
        // Master 可能已迁移到自己
        setTimeout(() => {
          if (tryBecomeHostWithBackup('原房主离开')) {
            // ok
          }
          render();
        }, 50);
      };

      client.onEvent = function (code, content, actorNr) {
        if (code === EVT_ACTION) {
          hostProcessAction(actorNr, content);
        } else if (code === EVT_STATE) {
          applyView(content);
        } else if (code === EVT_FULL) {
          fullStateBackup = content;
          // 若我已是房主但本地没有状态，立刻接管
          if (isHost() && !gameState && content) {
            gameState = JSON.parse(JSON.stringify(content));
            persistAndBroadcast();
          }
        } else if (code === EVT_HELLO) {
          if (isHost() && gameState) persistAndBroadcast();
        }
      };

      gameLog(`连接 Photon（asia），UserId=${client.getUserId()}...`);
      client.connectToRegionMaster('asia');
    }

    document.getElementById('startBtn').onclick = () => {
      if (offlineSim) return;
      if (isHost()) startGameAsHost();
    };

    document.getElementById('simBtn').onclick = () => startOfflineSim();
    document.getElementById('exitSimBtn').onclick = () => exitOfflineSim();

    function playerLabel(actorNr) {
      const p = view && view.players && view.players.find((x) => x.actorNr === actorNr);
      if (!p) return `#${actorNr}`;
      return `${p.name}（#${p.actorNr}）`;
    }

    function tryShootAt(targetActorNr) {
      if (!view || view.phase !== 'playing') return;
      if (view.awaiting) {
        alert('当前有其他结算进行中，稍后再开枪。');
        return;
      }
      if (Number(view.turnOrder[view.currentTurn]) !== Number(myActorNr)) {
        alert(`还没轮到你（当前行动 #${view.turnOrder[view.currentTurn]}）`);
        return;
      }
      const target = view.players.find((p) => Number(p.actorNr) === Number(targetActorNr));
      if (!target || !target.alive) return;

      const me = view.players.find((p) => Number(p.actorNr) === Number(myActorNr));
      const toSelf = Number(targetActorNr) === Number(myActorNr);

      const finishShoot = (nightOwlTargetNr) => {
        let confirmMsg = toSelf
          ? `确认对自己（${playerLabel(myActorNr)}）开枪？`
          : `确认对 ${playerLabel(targetActorNr)} 开枪？`;
        if (nightOwlTargetNr != null) {
          confirmMsg = `确认对自己开枪？\n（夜枭效果：若打出实弹，你与 ${playerLabel(nightOwlTargetNr)} 将一起扣血）`;
        }
        if (!confirm(confirmMsg)) return;
        sendAction({
          type: 'shoot',
          targetActorNr: Number(targetActorNr),
          nightOwlTargetNr
        });
        selectedHand = [];
      };

      if (toSelf && me && me.role === 'night_owl' && me.hp <= 4) {
        const foes = view.players.filter((p) => p.alive && Number(p.actorNr) !== Number(myActorNr));
        if (!foes.length) {
          finishShoot(undefined);
          return;
        }
        if (foes.length === 1) {
          finishShoot(foes[0].actorNr);
          return;
        }
        openPlayerPicker({
          title: '夜枭 · 选择连带目标',
          sub: '对自己开枪若打出实弹，将与所选对手一起扣血',
          players: view.players,
          selectable: (p) => p.alive && Number(p.actorNr) !== Number(myActorNr),
          min: 1,
          max: 1,
          confirmLabel: '确认目标',
          onConfirm: (nrs) => finishShoot(nrs[0])
        });
        return;
      }

      finishShoot(undefined);
    }

    document.getElementById('useItemBtn').onclick = () => {
      if (selectedHand.length !== 1) return;
      const itemIndex = selectedHand[0];
      const itemId = view.me.hand[itemIndex];

      if (itemId === 'bind') {
        openPlayerPicker({
          title: '捆绑',
          sub: '选择一名玩家，其下一回合无法行动',
          players: view.players,
          selectable: (p) => p.alive && Number(p.actorNr) !== Number(myActorNr),
          min: 1,
          max: 1,
          confirmLabel: '捆绑',
          onConfirm: (nrs) => {
            sendAction({ type: 'use_item', itemIndex, payload: { targetActorNr: nrs[0] } });
            selectedHand = [];
          }
        });
        return;
      }

      if (itemId === 'swap') {
        openSwapPicker(itemIndex);
        return;
      }

      if (itemId === 'double_arrow') {
        openPlayerPicker({
          title: '一箭双雕',
          sub: '选择 1~2 名玩家建立连锁；也可直接解除当前连锁',
          players: view.players,
          selectable: (p) => p.alive,
          min: 1,
          max: 2,
          confirmLabel: '建立连锁',
          extraLabel: '解除连锁',
          onConfirm: (nrs) => {
            sendAction({ type: 'use_item', itemIndex, payload: { targets: nrs } });
            selectedHand = [];
          },
          onExtra: () => {
            sendAction({ type: 'use_item', itemIndex, payload: { unlock: true } });
            selectedHand = [];
          }
        });
        return;
      }

      const payload = {};
      if (itemId === 'inspect') {
        payload.index = Math.max(0, Number(prompt('查看从上数第几发？', '1')) - 1);
      }
      sendAction({ type: 'use_item', itemIndex, payload });
      selectedHand = [];
    };

    function closePlayerPicker() {
      playerPickState = null;
      document.getElementById('playerPickOverlay').classList.remove('show');
      document.getElementById('playerPickGrid').innerHTML = '';
      document.getElementById('playerPickConfirm').disabled = true;
      document.getElementById('playerPickExtra').style.display = 'none';
      document.getElementById('playerPickHint').textContent = '已选 0';
    }

    function refreshPlayerPickHint() {
      if (!playerPickState) return;
      const { selected, min, max } = playerPickState;
      const hint = document.getElementById('playerPickHint');
      const conf = document.getElementById('playerPickConfirm');
      const names = selected.map((nr) => {
        const p = view && view.players.find((x) => Number(x.actorNr) === Number(nr));
        return p ? (Number(p.actorNr) === Number(myActorNr) ? `你·#${p.actorNr}` : `${p.name}·#${p.actorNr}`) : `#${nr}`;
      });
      if (!selected.length) {
        hint.textContent = max <= 1 ? `请选择 1 名玩家` : `已选 0 / ${max} · 可选 ${min}~${max} 人`;
      } else {
        hint.textContent = `已选：${names.join('、')}` + (max > 1 ? `（${selected.length}/${max}）` : '');
      }
      conf.disabled = selected.length < min || selected.length > max;
      document.querySelectorAll('#playerPickGrid .player-pick-card').forEach((btn) => {
        const nr = Number(btn.dataset.actor);
        btn.classList.toggle('picked', selected.includes(nr));
        const badge = btn.querySelector('.pick-badge');
        if (badge) {
          const i = selected.indexOf(nr);
          badge.textContent = i >= 0 ? (max > 1 ? `目标 ${i + 1}` : '已选') : '';
        }
      });
    }

    function openPlayerPicker(opts) {
      if (!view || !view.players || !view.players.length) return;
      closeSwapPicker();
      const players = (opts.players || view.players).slice();
      // 固定展示最多 4 人，按 actorNr 排序
      players.sort((a, b) => a.actorNr - b.actorNr);
      while (players.length < 4) {
        players.push(null);
      }
      const min = opts.min == null ? 1 : opts.min;
      const max = opts.max == null ? 1 : opts.max;
      const selectable = opts.selectable || ((p) => p && p.alive);
      playerPickState = {
        min,
        max,
        selected: [],
        onConfirm: opts.onConfirm || null,
        onExtra: opts.onExtra || null,
        onCancel: opts.onCancel || null
      };

      document.getElementById('playerPickTitle').textContent = opts.title || '选择目标';
      document.getElementById('playerPickSub').textContent = opts.sub || '点选玩家释放效果';
      document.getElementById('playerPickConfirm').textContent = opts.confirmLabel || '确认';
      const extraBtn = document.getElementById('playerPickExtra');
      if (opts.extraLabel && opts.onExtra) {
        extraBtn.style.display = '';
        extraBtn.textContent = opts.extraLabel;
      } else {
        extraBtn.style.display = 'none';
      }

      const grid = document.getElementById('playerPickGrid');
      grid.innerHTML = players.slice(0, 4).map((p, slot) => {
        if (!p) {
          return `<button type="button" class="player-pick-card" disabled>
            <div class="pick-art"><span class="glyph">—</span></div>
            <div class="pick-name">空位</div>
            <div class="pick-meta">座位 ${slot + 1}</div>
            <div class="pick-badge"></div>
          </button>`;
        }
        const role = roleMeta(p.role);
        const isMe = Number(p.actorNr) === Number(myActorNr);
        const can = selectable(p);
        const art = role.art
          ? `<img src="${role.art}" alt="${role.name}" draggable="false">`
          : `<span class="glyph">${role.glyph}</span>`;
        const name = isMe ? `你 · #${p.actorNr}` : `${p.name} · #${p.actorNr}`;
        const meta = `${role.name}${p.alive ? '' : ' · 出局'}${p.team != null && view.mode === 'team' ? (p.team === 0 ? ' · 红' : ' · 蓝') : ''}`;
        return `<button type="button" class="player-pick-card" data-actor="${p.actorNr}" ${can ? '' : 'disabled'}>
          <div class="pick-art">${art}</div>
          <div class="pick-name">${name}</div>
          <div class="pick-meta">${meta}</div>
          <div class="pick-badge"></div>
        </button>`;
      }).join('');

      grid.querySelectorAll('.player-pick-card[data-actor]').forEach((btn) => {
        if (btn.disabled) return;
        btn.onclick = () => {
          if (!playerPickState) return;
          const nr = Number(btn.dataset.actor);
          const pos = playerPickState.selected.indexOf(nr);
          if (pos >= 0) {
            playerPickState.selected.splice(pos, 1);
          } else if (playerPickState.selected.length < playerPickState.max) {
            playerPickState.selected.push(nr);
          } else if (playerPickState.max === 1) {
            playerPickState.selected = [nr];
          } else {
            playerPickState.selected[playerPickState.selected.length - 1] = nr;
          }
          refreshPlayerPickHint();
        };
      });

      refreshPlayerPickHint();
      document.getElementById('playerPickOverlay').classList.add('show');
    }

    document.getElementById('playerPickCancel').onclick = () => {
      const cancel = playerPickState && playerPickState.onCancel;
      closePlayerPicker();
      if (cancel) cancel();
    };

    document.getElementById('playerPickConfirm').onclick = () => {
      if (!playerPickState) return;
      const { selected, min, max, onConfirm } = playerPickState;
      if (selected.length < min || selected.length > max) return;
      const nrs = selected.slice();
      closePlayerPicker();
      if (onConfirm) onConfirm(nrs);
    };

    document.getElementById('playerPickExtra').onclick = () => {
      if (!playerPickState || !playerPickState.onExtra) return;
      const extra = playerPickState.onExtra;
      closePlayerPicker();
      extra();
    };

    function closeSwapPicker() {
      swapPickPending = null;
      swapPickSelected = [];
      document.getElementById('swapPickOverlay').classList.remove('show');
      document.getElementById('swapPickRow').innerHTML = '';
      document.getElementById('swapPickConfirm').disabled = true;
      document.getElementById('swapPickHint').textContent = '已选 0 / 2';
    }

    function refreshSwapPickHint() {
      const n = swapPickSelected.length;
      const hint = document.getElementById('swapPickHint');
      const conf = document.getElementById('swapPickConfirm');
      if (n === 0) hint.textContent = '已选 0 / 2 · 点击两发弹药';
      else if (n === 1) hint.textContent = `已选第 ${swapPickSelected[0] + 1} 发 · 再点另一发`;
      else hint.textContent = `交换第 ${swapPickSelected[0] + 1} 发 ↔ 第 ${swapPickSelected[1] + 1} 发`;
      conf.disabled = n !== 2;
      document.querySelectorAll('#swapPickRow .ammo-pick-shell').forEach((btn) => {
        const idx = Number(btn.dataset.index);
        btn.classList.toggle('picked', swapPickSelected.includes(idx));
      });
    }

    function openSwapPicker(itemIndex) {
      if (!view || !view.magazineCount || view.magazineCount < 2) {
        alert('弹药不足两发，无法换弹');
        return;
      }
      closePlayerPicker();
      swapPickPending = { itemIndex };
      swapPickSelected = [];
      const row = document.getElementById('swapPickRow');
      const count = view.magazineCount;
      row.innerHTML = Array.from({ length: count }, (_, i) => `
        <button type="button" class="ammo-pick-shell" data-index="${i}" aria-label="第 ${i + 1} 发">
          <span class="shell unknown"></span>
          <span class="ammo-pick-ord">第 ${i + 1} 发</span>
        </button>
      `).join('');
      row.querySelectorAll('.ammo-pick-shell').forEach((btn) => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.index);
          const pos = swapPickSelected.indexOf(idx);
          if (pos >= 0) {
            swapPickSelected.splice(pos, 1);
          } else if (swapPickSelected.length < 2) {
            swapPickSelected.push(idx);
          } else {
            // 已选两发时，再点替换第二发
            swapPickSelected[1] = idx;
          }
          refreshSwapPickHint();
        };
      });
      document.getElementById('swapPickSub').textContent =
        `当前转轮 ${count} 发 · 点选两发进行交换（第 1 发为下一发）`;
      refreshSwapPickHint();
      document.getElementById('swapPickOverlay').classList.add('show');
    }

    document.getElementById('swapPickCancel').onclick = () => closeSwapPicker();

    document.getElementById('swapPickConfirm').onclick = () => {
      if (!swapPickPending || swapPickSelected.length !== 2) return;
      const [i, j] = swapPickSelected;
      if (i === j) return;
      const itemIndex = swapPickPending.itemIndex;
      closeSwapPicker();
      sendAction({ type: 'use_item', itemIndex, payload: { i, j } });
      selectedHand = [];
    };

    document.getElementById('ironRoseBtn').onclick = () => {
      sendAction({ type: 'iron_rose', handIndexes: selectedHand.slice(0, 2) });
      selectedHand = [];
    };

    document.getElementById('snakeBtn').onclick = () => sendAction({ type: 'rattlesnake_copy' });
    document.getElementById('snakePassBtn').onclick = () => sendAction({ type: 'rattlesnake_pass' });

    document.getElementById('reconnectBtn').onclick = () => {
      preferredRoom = document.getElementById('roomName').value.trim() || 'DevilRoom_101';
      if (client) try { client.disconnect(); } catch (e) {}
      // 不清空 fullStateBackup：同页重连还能用；刷新则靠房间属性/他人备份
      gameState = null;
      view = null;
      createClient(true);
    };

    // 刷新后自动尝试 rejoin 上次房间
    const lastRoom = sessionStorage.getItem('dr_room');
    if (lastRoom) {
      document.getElementById('roomName').value = lastRoom;
      preferredRoom = lastRoom;
    }
    createClient(!!lastRoom);
  </script>
</body>

</html>
